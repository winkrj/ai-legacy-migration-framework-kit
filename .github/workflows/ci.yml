name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Codex 사본 drift 검사
        run: node scripts/sync-codex-plugin.mjs --check

      - name: 구현 지속·hook 실행 계약 검사
        run: |
          test "$(jq -r '.hooks.PreToolUse[0].hooks[0].command' plugins/legacy-migration/hooks/hooks.json)" = '/bin/bash ${PLUGIN_ROOT}/hooks/spec-gate.sh'
          grep -q '사람 승인 지점은 구현 전 한 번' plugins/legacy-migration/skills/legacy-migration/SKILL.md
          grep -q 'Goal 기능이 있으면' plugins/legacy-migration/skills/legacy-migration/references/implement.md
          grep -q 'FIX REQUIRED.*자동 수정' plugins/legacy-migration/skills/legacy-migration/references/review.md
          grep -q 'Open.*하나라도 있으면 blocker' plugins/legacy-migration/skills/legacy-migration/references/implement.md
          grep -q '실행 지속 게이트' plugins/legacy-migration/skills/legacy-migration/references/implement.md
          grep -q '진행하겠습니다.*응답을 끝내는 것은 금지' plugins/legacy-migration/skills/legacy-migration/references/implement.md
          grep -q '부분 패치.*종료 조건이 아니다' plugins/legacy-migration/skills/legacy-migration/references/implement.md
          ! grep -q 'Discover, Specify, Plan 각각' plugins/legacy-migration/skills/legacy-migration/references/full.md

      - name: Claude 플러그인 실행 계약 검사
        run: |
          # Claude Code가 실제로 로드하는 것은 commands/ 와 루트 skills/ 다.
          # 이 파일들은 Codex 사본으로 동기화되지 않으므로 따로 검사한다.
          test "$(jq -r '.hooks.PreToolUse[0].hooks[0].command' hooks/hooks.json)" = '"${CLAUDE_PLUGIN_ROOT}/hooks/spec-gate.sh"'
          test -x hooks/spec-gate.sh
          for f in commands/*.md agents/*.md skills/legacy-migration/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "frontmatter 없음: $f"; exit 1; }
          done
          # 참조하는 ${CLAUDE_PLUGIN_ROOT} 경로가 실제로 존재하는지
          grep -rho '${CLAUDE_PLUGIN_ROOT}/[A-Za-z0-9_./-]*' commands/ skills/ \
            | sed 's|${CLAUDE_PLUGIN_ROOT}/||' | sed 's|/$||' | sort -u \
            | while read -r p; do test -e "$p" || { echo "없는 경로 참조: $p"; exit 1; }; done
          # 단일 승인 + 지속 실행 계약 (Codex references와 동일 의미)
          grep -q '사람 승인 지점은 구현 전 한 번' skills/legacy-migration/SKILL.md
          grep -q '실행 지속 게이트' commands/implement.md
          grep -q 'Goal 기능이 있으면' commands/implement.md
          grep -q '진행하겠습니다.*응답을 끝내는 것은 금지' commands/implement.md
          grep -q '부분 패치.*종료 조건이 아니다' commands/implement.md
          grep -q 'Open.*하나라도 있으면 blocker' commands/implement.md
          grep -q 'FIX REQUIRED.*자동 수정' commands/review.md
          # `! grep`은 set -e에서 실패를 무시하므로 명시적으로 exit 한다
          if grep -q 'Discover, Specify, Plan 각각' commands/full.md; then
            echo "Full 모드에 단계별 승인이 되살아났습니다"; exit 1
          fi
          # 폐기된 6가지 멈춤 조건이 되살아나면 교체·삭제·공유 코드가 다시 blocker가 된다
          if grep -q '6가지 중 해당 항목' commands/implement.md; then
            echo "폐기된 6가지 멈춤 조건이 되살아났습니다"; exit 1
          fi
          # 버전은 세 manifest가 항상 같아야 한다
          test "$(jq -r .version .claude-plugin/plugin.json)" \
             = "$(jq -r .version plugins/legacy-migration/.codex-plugin/plugin.json)"
          test "$(jq -r .version .claude-plugin/plugin.json)" = "$(jq -r .version package.json)"

      - name: Validator CLI 준비
        run: |
          git clone --depth 1 https://github.com/winkrj/legacy-migration-validator-cli.git /tmp/validator
          cd /tmp/validator && npm ci

      - name: Full 템플릿 검증
        run: |
          node /tmp/validator/dist/index.js validate \
            --root templates/migration-docs \
            --report /tmp/template-report.md

      - name: 예제 케이스 검증 (docs + changes)
        run: |
          node /tmp/validator/dist/index.js validate \
            --root examples/content-query-migration/docs/migration/case-01-content-query \
            --root examples/content-query-migration/changes/migrate-content-query \
            --report /tmp/example-report.md

      - name: spec-gate 훅 회귀 테스트
        run: |
          T=$(mktemp -d) && cd "$T"
          git init -q && git -c user.email=ci@ci -c user.name=ci commit -qm init --allow-empty
          git checkout -qb feature/ai-migration-visitreview
          HOOK="$GITHUB_WORKSPACE/hooks/spec-gate.sh"
          expect() { # expect <기대exit> <payload>
            # `bash -e`에서 죽지 않도록 실패를 || 로 받아 종료 코드를 읽는다.
            local actual=0
            echo "$2" | bash "$HOOK" >/dev/null 2>&1 || actual=$?
            [ "$actual" = "$1" ] || { echo "FAIL: 기대 $1, 실제 $actual — $2"; exit 1; }
          }
          EDIT='{"tool_input":{"file_path":"src/Main.java"}}'
          SHELL_WRITE='{"tool_input":{"command":"cat > src/Main.java <<EOF"}}'
          COPY_CODE='{"tool_input":{"command":"cp template.java src/Main.java"}}'
          COPY_DOC='{"tool_input":{"command":"cp template.md docs/migration/case-01-visit-review/01_Discover.md"}}'
          BUILD='{"tool_input":{"command":"./gradlew build"}}'
          DOC='{"tool_input":{"file_path":"docs/migration/case-01-visit-review/01_Discover.md"}}'

          # 미승인: 편집·셸 쓰기는 차단, 빌드·문서는 통과
          mkdir -p docs/migration/case-01-visit-review
          expect 2 "$EDIT"
          expect 2 "$SHELL_WRITE"
          expect 2 "$COPY_CODE"
          expect 0 "$BUILD"
          expect 0 "$DOC"
          expect 0 "$COPY_DOC"

          # 승인 후: 케이스 폴더명이 브랜치명과 달라도 인식해야 한다 (영구 차단 회귀 방지)
          printf 'Implementation Permission: Granted\n' > docs/migration/case-01-visit-review/03_Plan.md
          expect 0 "$EDIT"
          expect 0 "$SHELL_WRITE"

          # 이관 브랜치가 아니면 개입하지 않는다
          git checkout -qb other
          expect 0 "$EDIT"

          # 읽기 전용 서브에이전트 role은 승인 여부·브랜치와 무관하게 쓰기 차단
          git checkout -q feature/ai-migration-visitreview
          RO_PATCH='{"tool_name":"apply_patch","agent_type":"legacy_explorer","tool_input":{}}'
          RO_SHELL='{"tool_name":"Bash","agent_type":"spec_gap_hunter","tool_input":{"command":"echo x > src/A.java"}}'
          REVIEW_WRITE='{"tool_name":"apply_patch","agent_type":"migration_reviewer","tool_input":{}}'
          RO_READ='{"tool_name":"Bash","agent_type":"legacy_explorer","tool_input":{"command":"grep -rn foo src/"}}'
          expect 2 "$RO_PATCH"
          expect 2 "$RO_SHELL"
          expect 2 "$REVIEW_WRITE"
          expect 0 "$RO_READ"
